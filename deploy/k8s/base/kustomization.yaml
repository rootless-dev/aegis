apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied to every resource below, so no manifest has to repeat it and nothing
# can be deployed to the wrong place by omission.
namespace: aegis

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# What overlays override, and what the release bumps. Both this and the tag in
# the deployment carry the annotation, so release-please writes the new version
# to each and they cannot drift apart.
images:
  - name: aegis
    newTag: 0.0.3 # x-release-please-version
