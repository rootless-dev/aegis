apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied to every resource below, so no manifest has to repeat it and nothing
# can be deployed to the wrong place by omission.
namespace: aegis

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# The tag lives here rather than in the deployment, so releasing means editing
# one line. An untagged image resolves to latest, which is not reproducible: two
# rollouts of the same manifest can land on different builds.
images:
  - name: aegis
    newTag: 0.0.1
