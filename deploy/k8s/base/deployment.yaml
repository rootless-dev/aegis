apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis
  labels:
    app.kubernetes.io/name: aegis
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis
    spec:
      # Has to exceed GRACEFUL_SHUTDOWN_TIMEOUT, otherwise SIGKILL lands in the
      # middle of the shutdown and in flight requests are cut.
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: aegis
          # Tagged rather than floating: an untagged image resolves to latest,
          # and two rollouts of the same manifest could land on different
          # builds. Kustomize overrides it from kustomization.yaml, and
          # release-please keeps both in step through the annotation.
          image: aegis:0.0.3 # x-release-please-version
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 7500

          env:
            - name: HTTP_SERVER_HOST
              value: "0.0.0.0"
            # No Ingress ships with this base, but an identity provider belongs
            # behind a gateway that terminates TLS, and that is what the base
            # assumes. Add the Ingress and keep this as it is; an install where
            # nothing sits in front sets "none" instead, and one that serves TLS
            # from the pod sets "app" and mounts a key pair.
            - name: TLS_TERMINATION
              value: "proxy"
            # The peers allowed to speak for the client through the forwarded
            # headers. MUST match the pod network the gateway calls from: with
            # the wrong range the headers are ignored, and with the list empty
            # "proxy" refuses to boot.
            - name: PROXY_TRUSTED_PROXIES
              value: "10.0.0.0/8"
            # MUST be replaced: it is what clients reach this deployment at, and
            # every issuer and redirect is built from it.
            - name: PUBLIC_URL
              value: "https://aegis.example.com"

            # One of postgres, mysql or mariadb. There is no default: only the
            # operator knows which engine backs this deployment, and a guess
            # would pick the wrong migration lineage. sqlite is a development
            # engine and the prod profile this base runs under refuses it.
            - name: DATABASE_DRIVER
              value: "postgres"
            # MUST be replaced: the database server this deployment connects to.
            - name: DATABASE_HOST
              value: "db.internal"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "aegis"
            - name: DATABASE_USER
              value: "aegis"
            # Never a plain value here, and never in a ConfigMap: a secret that
            # can be read from a manifest eventually ends up committed. Create
            # the Secret out of band, e.g.
            # kubectl create secret generic aegis-database --from-literal=password=...
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-database
                  key: password
            # verify-full authenticates the server as well as encrypting the
            # connection; see docs/configuration.md for the full vocabulary.
            - name: DATABASE_SSL_MODE
              value: "verify-full"
            # Read only by ssl_mode verify-ca and verify-full. Commented out on
            # purpose, the way "path" is in aegis.example.yaml: the base mounts
            # no volume for it, and readOnlyRootFilesystem means the path above
            # would fail to open if left uncommented -- an installation against
            # a private CA has to add both the volume and this variable
            # together, not just this value.
            # - name: DATABASE_SSL_ROOT_CERT
            #   value: "/etc/aegis/db-ca.pem"

            - name: LOGGING_PRETTY_ENABLED
              value: "false"
            # Long enough for this Service to stop sending traffic here before
            # the server stops accepting connections.
            - name: HEALTH_DRAIN_DELAY
              value: "5s"

          # Liveness checks nothing external on purpose: a slow dependency
          # would otherwise fail every replica and have them all restarted.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Covers a slow start without making the liveness threshold generous
          # for the whole life of the pod.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
