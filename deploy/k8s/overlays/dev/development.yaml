# Development only. The base hardening is what production runs; the two changes
# here exist so the inner loop works, and neither should ever be promoted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis
spec:
  # One replica: live_update would otherwise sync the binary into every pod for
  # no benefit.
  replicas: 1
  template:
    spec:
      containers:
        - name: aegis
          # Tilt copies the rebuilt binary into the running container, which a
          # read only root filesystem forbids.
          securityContext:
            readOnlyRootFilesystem: false
          env:
            - name: LOGGING_LEVEL
              value: debug
            - name: HEALTH_DRAIN_DELAY
              value: "1s"
            # The development profile serves TLS from a certificate generated in
            # memory at every boot, so the cluster exercises the same path
            # production takes rather than a plain HTTP shortcut that only exists
            # here.
            - name: AEGIS_PROFILE
              value: dev
            - name: TLS_TERMINATION
              value: "app"
            # Cleared: the base declares the ranges of the gateway it assumes,
            # and trusted proxies with no gateway in front is a contradiction
            # the boot refuses. An empty value counts as absent.
            - name: PROXY_TRUSTED_PROXIES
              value: ""
            - name: PUBLIC_URL
              value: "https://localhost:7500"

            # The loop runs against the engine a customer runs, not against
            # sqlite: what breaks between the two -- concurrent writes, locking,
            # types, transactional DDL -- is exactly what this service is going
            # to depend on. Running the binary by hand still falls back to
            # sqlite, which is the shortcut for seeing it up rather than for
            # developing against it.
            #
            # DATABASE_PASSWORD is left to the base, which reads the Secret this
            # overlay generates.
            - name: DATABASE_DRIVER
              value: postgres
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_NAME
              value: aegis
            - name: DATABASE_USER
              value: aegis
            # Declared rather than left empty: an empty mode means "prefer",
            # which falls back to an unencrypted connection without saying so.
            # Inside the cluster, on a database this same overlay creates, that
            # is the deliberate answer.
            - name: DATABASE_SSL_MODE
              value: disable
            - name: DATABASE_SSL_ROOT_CERT
              value: ""

          # Probes have to follow: the listener no longer speaks plain HTTP. The
          # kubelet does not verify the certificate it is offered, which is what
          # makes a self-signed one workable here.
          livenessProbe:
            httpGet:
              scheme: HTTPS
          readinessProbe:
            httpGet:
              scheme: HTTPS
          startupProbe:
            httpGet:
              scheme: HTTPS
