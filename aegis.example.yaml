# Configuration file for aegis.
#
# Searched in order: the path in AEGIS_CONFIG_FILE, then ./aegis.yaml, then
# /etc/aegis/aegis.yaml. The first file found is used; the others are fallbacks,
# not layers to merge.
#
# Precedence is defaults, then this file, then environment variables. Every key
# is optional: what is not declared here keeps its default, and an unknown key
# fails the boot rather than being ignored.

app_name: Aegis

# One of: prod, dev. Production is the default, so forgetting it never turns a
# deployment into the one handing out development shortcuts. The --dev flag and
# AEGIS_PROFILE select it too, in that order of precedence.
profile: prod

# Where clients actually reach this deployment. It cannot be derived from the
# listener — behind a gateway the process knows nothing about the hostname
# browsers use — and it is what issuers and redirects are built from, so a wrong
# value only ever surfaces as a client rejecting a token. Required in
# production; the dev profile fills it in from the listener.
public_url: "https://auth.example.com"

logging:
  # One of: debug, info, warn, error, fatal, panic.
  level: INFO
  caller: 1
  time_field: ""
  time_format: "2006-01-02 15:04:05"
  # Colored console output, applied only when stderr is a terminal.
  pretty_enabled: true

http_server:
  host: 0.0.0.0
  port: "7500"
  # Bounds header reading; the slowloris defense.
  read_header_timeout: 5s
  read_timeout: 15s
  # Has to accommodate the worst case of the authentication path, argon2id
  # included.
  write_timeout: 15s
  idle_timeout: 60s
  # Deadline carried on the request context. Must not exceed write_timeout.
  request_timeout: 10s
  max_header_bytes: 1048576

tls:
  # Who ends the TLS connection. There is no default in production on purpose:
  # "no certificate was configured" and "a gateway handles TLS" produce exactly
  # the same configuration, and only an operator can tell them apart.
  #
  #   app    this process serves HTTPS and needs the key pair below
  #   proxy  a gateway terminates TLS and forwards the original scheme and
  #          client address; proxy.trusted_proxies is then required
  #   none   plain HTTP with nothing in front, or a service mesh doing
  #          transparent mTLS; forwarded headers are ignored
  #
  # Under the dev profile this defaults to none: a local run is plain HTTP and
  # needs nothing configured. Setting it to app there serves HTTPS from a
  # certificate generated at boot, with no key pair to provide.
  termination: proxy

  # PEM encoded, and only for termination "app". Java keystores are not read:
  # one format is enough.
  cert_file: ""
  key_file: ""

  # How often the pair is read again. Issuers rotate the files in place, and a
  # certificate loaded once at boot would only be renewed by restarting.
  reload_interval: 1h

  # The minimum TLS version and the cipher suites are deliberately not
  # configurable: the only answer that stays right over time is the one the
  # standard library keeps current, and a floor pinned here ages into the
  # weakest thing this service still accepts.

proxy:
  # Which family of headers the gateway writes: "x-forwarded" (the de facto
  # standard every ingress emits) or "forwarded" (RFC 7239, which some proxies
  # use instead). Only the configured one is read, and the other is stripped
  # from the request: a deployment has one gateway, and accepting both would
  # mean deciding what to do when they disagree.
  headers: x-forwarded

  # The peers allowed to speak for the client through the forwarded headers.
  # Required by, and only accepted with, termination "proxy": without a boundary
  # any client could claim it arrived over HTTPS from another address. Takes CIDR
  # blocks or bare addresses, which are read as a single host.
  trusted_proxies:
    - 10.0.0.0/8
    # - 192.168.1.10

hsts:
  # Only ever sent over a connection that already is HTTPS.
  enabled: true
  max_age: 8760h
  # Reaches every host under this domain, including ones this deployment knows
  # nothing about, and cannot be taken back before the announced max age runs
  # out on each browser.
  include_subdomains: false

csp:
  # The Content-Security-Policy sent with every HTML page. The policy itself is
  # not configurable: one pinned in a file ages into the weakest thing this
  # service still allows. This switch is for local debugging.
  #
  # The other security headers are always sent and have no switch.
  enabled: true

database:
  # One of: postgres, mysql, mariadb, sqlite. There is no default outside
  # development: only the operator knows which engine they run, and a guess
  # here would pick the wrong migration lineage. sqlite is a development
  # engine and is refused under the prod profile.
  driver: postgres

  host: db.internal
  # Left empty, the engine's own default is used: 5432 or 3306.
  port: "5432"
  name: aegis
  user: aegis
  # The password is deliberately not a key here. Writing it fails the boot;
  # DATABASE_PASSWORD is the only route, because a secret that can live in a
  # configuration file eventually gets committed.

  # sqlite only, and only under the dev profile.
  # path: ./aegis.dev.db

  # One of: disable, prefer, require, verify-ca, verify-full. Postgres'
  # vocabulary, used for every engine so the setting means the same thing
  # everywhere. Note that require encrypts without verifying anything: it stops
  # a passive listener, not an active attacker.
  #
  # Required outside the dev profile, and "disable" is a legitimate answer for
  # a database on a private network: what the boot refuses is leaving it unsaid,
  # since an empty value means prefer, which quietly accepts plaintext.
  ssl_mode: verify-full
  # Only read by the two verify- modes.
  ssl_root_cert: /etc/aegis/db-ca.pem

  # Anything specific to this installation. Whatever aegis depends on is forced
  # by the driver and rejected here, so a setting that would break the service
  # fails the boot instead of quietly doing nothing.
  options:
    application_name: aegis

  connect_timeout: 10s

  pool:
    max_open: 25
    # Matching max_open on purpose: a smaller idle count makes the pool close
    # and reopen connections under load, and every reopen pays a TLS handshake.
    max_idle: 25
    # Stays under the NAT and firewall idle timeouts that commonly drop
    # connections around an hour. Without it the symptom is a sporadic
    # "invalid connection" with no visible cause.
    conn_max_lifetime: 30m
    conn_max_idle_time: 5m

graceful:
  # Whole shutdown budget, shared by every pending. Must fit the window the
  # orchestrator allows between SIGTERM and SIGKILL.
  timeout: 20s

health:
  check_timeout: 2s
  # How long readiness keeps failing before connections stop being accepted, so
  # the load balancer takes this instance out of rotation first. Must be shorter
  # than graceful.timeout.
  drain_delay: 5s

banner:
  # Worth turning off where logs are collected and parsed as structured
  # entries: the startup art is not JSON.
  enabled: true
