name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege by default. Any job needing more raises it for itself.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Reads the version from go.mod so it never drifts from the module.
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # covermode=atomic is required alongside -race; the default mode is not
      # safe under concurrent access and would report bogus numbers.
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o bin/aegisd ./cmd/server

      # The binary has to survive a boot with no environment at all, which is
      # what catches a default that stopped being valid.
      # Compiles the binary and runs it: boot on defaults, the shutdown
      # ordering, and a refused boot on invalid configuration. None of that is
      # reachable from the unit tests, which build the configuration by hand
      # and never go through main.
      - name: Integration tests
        run: go test -tags=integration -timeout=5m ./test/integration/...

      - uses: actions/upload-artifact@v7
        with:
          name: aegisd
          path: bin/aegisd
          retention-days: 7

  gosec:
    name: Security (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run gosec
        uses: securego/gosec@v2.28.0
        with:
          # No -no-fail: a finding has to break the build. This is an identity
          # provider, and a warning nobody reads is the same as no scanner.
          args: -fmt=text -exclude-dir=.github ./...

  sonar:
    name: Security (SonarQube)
    runs-on: ubuntu-latest
    needs: test
    # Community Edition analyses a single branch: running it on pull requests
    # would overwrite the main branch results with the branch under review.
    if: github.event_name == 'push'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # A secret rather than a variable: this repository is public, so its
      # workflow logs are too, and a secret is masked in them. The address is
      # not sensitive in itself, but there is no reason to publish it.
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar uses the history to attribute issues to authors and to tell
          # new code from old.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Skipped
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "SONAR_TOKEN or SONAR_HOST_URL is not set, skipping the analysis."
