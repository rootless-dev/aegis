sonar.projectKey=aegis
sonar.projectName=aegis

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Generated, not authored: the pipeline fails the build on a failed quality
# gate, and an un-excluded minified bundle would be a red build no code change
# can fix. app.css is the current one; *.min.js is here ahead of the first one
# that lands.
sonar.exclusions=**/*_test.go,**/vendor/**,internal/templates/assets/css/app.css,**/*.min.js

# Excluded from coverage only, never from analysis: these still get scanned for
# bugs and smells, they just stop being asked for unit tests. All three are
# assembly with no branching of their own — the entry point, the lifecycle and
# the resource list — and what exercises them is the integration suite, which
# runs the compiled binary and therefore never reaches the coverage profile.
#
# Anything with a decision in it stays measured, wiring.go included.
#
# templates.go joins the list for the same reason: two embed directives and two
# accessors with no branch in them.
sonar.coverage.exclusions=cmd/**,internal/application/application.go,internal/application/resources.go,internal/templates/templates.go

# Produced by `go test -coverprofile=coverage.out` in the test job.
sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
